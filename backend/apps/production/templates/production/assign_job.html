{% extends 'adminlte/base.html' %}
{% load static i18n core_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-3">
        <div class="col">
            <h1 class="h3">{{ title }}</h1>
        </div>
        <div class="col-auto">
            <a href="{% url 'production:production_job_detail' job.pk %}" class="btn btn-secondary">
                <i class="bi bi-arrow-right"></i> {% trans 'عودة' %}
            </a>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">{% trans 'أمر الإنتاج' %}</label>
                    <input type="text" class="form-control" value="{{ job.job_number }}" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">{% trans 'الموظف' %}</label>
                    <select name="employee_id" class="form-control" required>
                        <option value="">{% trans '--- اختر موظف ---' %}</option>
                        {% for emp in employees %}
                        <option value="{{ emp.pk }}" {% if job.assigned_to_id == emp.pk %}selected{% endif %}>{{ emp.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg"></i> {% trans 'إسناد' %}
                    </button>
                    <a href="{% url 'production:production_job_detail' job.pk %}" class="btn btn-secondary">
                        {% trans 'إلغاء' %}
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
