{% extends 'adminlte/base.html' %}
{% load static i18n core_tags %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row mb-3">
        <div class="col">
            <h1 class="h3">{{ title }}</h1>
        </div>
    </div>

    <div class="card">
        <div class="card-body text-center">
            <div class="mb-4">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
            </div>
            <h4 class="mb-3">{% trans 'هل أنت متأكد من حذف المورد؟' %}</h4>
            <p class="text-muted mb-4">{{ supplier.company_name }}</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="bi bi-trash"></i> {% trans 'تأكيد الحذف' %}
                </button>
                <a href="{% url 'suppliers:supplier_list' %}" class="btn btn-secondary">
                    <i class="bi bi-x-lg"></i> {% trans 'إلغاء' %}
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
